name: Flutter mobile checks

on:
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    branches: [main, getResult]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-mobile.yml"

concurrency:
  group: flutter-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Release builds stay local because GoogleService-Info.plist,
  # google-services.json and store signing material are intentionally untracked.
