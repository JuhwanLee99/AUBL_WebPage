# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load public Firebase web config
        env:
          FIREBASE_WEB_CONFIG_URL: https://aubl-backup.web.app/__/firebase/init.json
          EXPECTED_FIREBASE_PROJECT_ID: aubl-backup
        run: node scripts/load-firebase-build-env.mjs
      - run: npm ci && npm run check:ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: functions/requirements.txt
      - run: pip install -r functions/requirements.txt
      - run: PYTHONPATH=functions python -m unittest discover -s functions/tests -p 'test_*.py'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUBL_WEB_9A141 }}
          channelId: live
          projectId: aubl-web-9a141
