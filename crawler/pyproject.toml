[project]
name = "crawler"
version = "0.1.0"
description = "Lightweight crawler utilities."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "tenacity>=8.2.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.0.1",
]

[project.scripts]
crawler-sync = "crawler.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
