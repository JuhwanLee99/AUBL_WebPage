    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const storageKey = 'aubl:theme:v1';
        let stored = null;
        try { stored = localStorage.getItem(storageKey); } catch { /* Use the system preference. */ }
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#07142b' : '#ffffff');
      })();
    </script>
